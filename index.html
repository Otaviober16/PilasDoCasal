<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Meta tag ajustada para prevenir zoom indesejado no mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Configurações para funcionar como App na Tela de Início (iOS e Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pilas do Casal">
  <meta name="theme-color" content="#4f46e5">

  <title>Pilas do Casal 💰</title>

  <!-- Ícones e Manifest PWA -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts & Chart.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --text-muted: #6b7280;
      --receita: #10b981;
      --despesa: #ef4444;
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px 12px 40px 12px;
      max-width: 800px;
      margin: 0 auto;
      user-select: none; /* Sensação de app nativo */
    }

    /* Cabeçalho */
    header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 10px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
    }

    header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .month-picker-container {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .month-picker-container label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .month-picker-container input[type="month"] {
      padding: 6px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background-color: #fff;
      color: var(--text-color);
      outline: none;
    }

    /* Grid Resumo / Saldo */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .card-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .card-value {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 6px;
    }

    .card-value.receita { color: var(--receita); }
    .card-value.despesa { color: var(--despesa); }
    .card-value.saldo { color: var(--primary); }

    /* Formulário */
    .form-card {
      margin-bottom: 20px;
    }

    .form-card h2 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 600px) {
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .form-grid .full-width {
        grid-column: span 2;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Forçar font-size 16px nos inputs evita zoom automático no iOS */
    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      background-color: #fff;
      color: var(--text-color);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, 
    .form-group select:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:active {
      transform: scale(0.98);
      background-color: var(--primary-hover);
    }

    /* Gráfico e Tabela */
    .chart-container {
      position: relative;
      height: 240px;
      width: 100%;
      margin-top: 10px;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 10px;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 8px;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--despesa);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.receita { background-color: #d1fae5; color: #065f46; }
    .badge.despesa { background-color: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <header>
    <h1>Pilas do Casal 💰</h1>
    <p>Controle financeiro compartilhado</p>
    <div class="month-picker-container">
      <label for="filtro-mes">Mês:</label>
      <input type="month" id="filtro-mes">
    </div>
  </header>

  <!-- Dashboard de Resumo -->
  <section class="summary-grid">
    <div class="card">
      <div class="card-title">Receitas</div>
      <div class="card-value receita" id="total-receita">R$ 0,00</div>
    </div>
    <div class="card">
      <div class="card-title">Despesas</div>
      <div class="card-value despesa" id="total-despesa">R$ 0,00</div>
    </div>
    <div class="card">
      <div class="card-title">Saldo Total</div>
      <div class="card-value saldo" id="total-saldo">R$ 0,00</div>
    </div>
  </section>

  <!-- Formulário de Lançamento -->
  <section class="card form-card">
    <h2>➕ Novo Lançamento</h2>
    <form id="finance-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Mercado, Luz, Salário" required>
        </div>

        <div class="form-group">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" step="0.01" placeholder="0,00" required>
        </div>

        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo" required>
            <option value="despesa">Despesa</option>
            <option value="receita">Receita</option>
          </select>
        </div>

        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria" required>
            <option value="Alimentação">Alimentação</option>
            <option value="Moradia">Moradia</option>
            <option value="Transporte">Transporte</option>
            <option value="Lazer">Lazer</option>
            <option value="Saúde">Saúde</option>
            <option value="Investimentos">Investimentos</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="data">Data</label>
          <input type="date" id="data" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">➕ Adicionar Lançamento</button>
    </form>
  </section>

  <!-- Gráficos -->
  <section class="card form-card">
    <h2>📊 Despesas por Categoria</h2>
    <div class="chart-container">
      <canvas id="categoryChart"></canvas>
    </div>
  </section>

  <!-- Lista de Lançamentos -->
  <section class="card form-card">
    <h2>📜 Histórico</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="lista-lancamentos">
          <!-- Os lançamentos do Firebase aparecerão aqui -->
        </tbody>
      </table>
    </div>
  </section>

  <script>
    // Inicialização do Firebase com as suas chaves reais
    const firebaseConfig = {
      apiKey: "AIzaSyAPThd7n9SL6srDoMm7sqqHW-n5dGlF2vM",
      authDomain: "pilasdocasal.firebaseapp.com",
      projectId: "pilasdocasal",
      storageBucket: "pilasdocasal.appspot.com",
      messagingSenderId: "1400139722877",
      appId: "1:1400139722877:web:a5857472fc0b284846d114"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Elementos DOM
    const form = document.getElementById('finance-form');
    const listaLancamentos = document.getElementById('lista-lancamentos');
    const totalReceitaEl = document.getElementById('total-receita');
    const totalDespesaEl = document.getElementById('total-despesa');
    const totalSaldoEl = document.getElementById('total-saldo');
    const inputData = document.getElementById('data');
    const filtroMesInput = document.getElementById('filtro-mes');

    // Preencher campo data com a data de hoje por padrão
    const hoje = new Date();
    inputData.valueAsDate = hoje;

    // Selecionar o mês atual no filtro por padrão
    const anoMesAtual = hoje.toISOString().slice(0, 7);
    filtroMesInput.value = anoMesAtual;

    let todosLancamentos = [];
    let chartInstance = null;

    // Função para formatar moeda
    function formatarMoeda(valor) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
    }

    // Adicionar Lançamento
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const descricao = document.getElementById('descricao').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const tipo = document.getElementById('tipo').value;
      const categoria = document.getElementById('categoria').value;
      const data = document.getElementById('data').value;

      try {
        await db.collection('lancamentos').add({
          descricao,
          valor,
          tipo,
          categoria,
          data,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Limpar formulário mantendo a data de hoje
        form.reset();
        inputData.valueAsDate = new Date();
      } catch (error) {
        alert("Erro ao salvar lançamento: " + error.message);
      }
    });

    // Deletar Lançamento
    async function deletarLancamento(id) {
      if (confirm("Tem certeza que deseja excluir este lançamento?")) {
        await db.collection('lancamentos').doc(id).delete();
      }
    }

    // Atualizar Gráfico de Categorias
    function atualizarGrafico(lancamentos) {
      const despesas = lancamentos.filter(l => l.tipo === 'despesa');
      const categorias = {};

      despesas.forEach(d => {
        categorias[d.categoria] = (categorias[d.categoria] || 0) + d.valor;
      });

      const labels = Object.keys(categorias);
      const values = Object.values(categorias);

      const ctx = document.getElementById('categoryChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels.length ? labels : ['Sem dados'],
          datasets: [{
            data: values.length ? values : [1],
            backgroundColor: labels.length ? [
              '#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#6b7280'
            ] : ['#e5e7eb']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    // Renderizar Lançamentos filtrados pelo Mês
    function renderizar() {
      const mesSelecionado = filtroMesInput.value;
      let totalReceita = 0;
      let totalDespesa = 0;

      listaLancamentos.innerHTML = '';

      const lancamentosFiltrados = todosLancamentos.
